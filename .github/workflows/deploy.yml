name: Deploy to cPanel via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to cPanel via SSH
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, zip, gd, bcmath
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer Dependencies (Production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets (Vite)
        run: npm run build

      - name: Configure SSH Key & Hostname
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          CLEAN_HOST=$(echo "${SSH_HOST}" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/.*$||')
          echo "CLEAN_HOST=${CLEAN_HOST}" >> $GITHUB_ENV

          mkdir -p ~/.ssh
          printf "%s\n" "${SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [ -n "${SSH_PASSPHRASE}" ]; then
            ssh-keygen -p -P "${SSH_PASSPHRASE}" -N "" -f ~/.ssh/id_rsa || true
          fi

          ssh-keyscan -p ${SSH_PORT:-2223} -H "${CLEAN_HOST}" >> ~/.ssh/known_hosts || true

      - name: Package Application Archive (Zip)
        run: |
          zip -q -r deploy.zip . -x ".git/*" ".github/*" ".codex/*" ".vscode/*" "node_modules/*" ".env" ".env.*" "tests/*" "phpunit.xml" "storage/logs/*"

      - name: Transfer Archive to cPanel via SCP
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
        run: |
          scp -i ~/.ssh/id_rsa -P ${SSH_PORT:-2223} -o StrictHostKeyChecking=no deploy.zip ${SSH_USERNAME}@${CLEAN_HOST}:~/deploy.zip

      - name: Extract & Execute Artisan Commands on cPanel
        env:
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          REMOTE_TARGET: ${{ secrets.REMOTE_TARGET }}
        run: |
          ssh -i ~/.ssh/id_rsa -p ${SSH_PORT:-2223} -o StrictHostKeyChecking=no ${SSH_USERNAME}@${CLEAN_HOST} << 'EOF'
            set -e
            TARGET="${REMOTE_TARGET:-/home/band2936/kalimarau}"
            mkdir -p "$TARGET"
            unzip -o ~/deploy.zip -d "$TARGET"
            rm ~/deploy.zip
            cd "$TARGET"
            php artisan migrate --force
            php artisan storage:link 2>/devnull || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
            echo "SUCCESSFUL_DEPLOYMENT"
          EOF
