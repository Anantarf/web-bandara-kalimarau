name: Deploy to cPanel via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to cPanel via SSH
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
      REMOTE_TARGET: ${{ secrets.REMOTE_TARGET }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, zip, gd, bcmath
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies (Production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Frontend Assets (Vite)
        run: npm run build

      - name: Configure SSH Key & Hostname
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          : "${SSH_USERNAME:?SSH_USERNAME secret is required}"
          : "${SSH_KEY:?SSH_KEY secret is required}"
          TARGET_HOST=$(echo "${SSH_HOST:-colorado.iixcp.rumahweb.net}" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/.*$||')
          echo "TARGET_HOST=${TARGET_HOST}" >> $GITHUB_ENV

          mkdir -p ~/.ssh
          printf "%s\n" "${SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [ -n "${SSH_PASSPHRASE}" ]; then
            ssh-keygen -p -P "${SSH_PASSPHRASE}" -N "" -f ~/.ssh/id_rsa || true
          fi

          ssh-keyscan -p ${SSH_PORT:-2223} -H "${TARGET_HOST}" >> ~/.ssh/known_hosts || true

      - name: Package Application Archive (tar.gz)
        run: |
          tar -czf deploy.tar.gz \
            --exclude="public/storage" \
            --exclude="storage/logs/*" \
            --exclude="storage/framework/*" \
            --exclude="node_modules" \
            --exclude=".git" \
            app bootstrap config database lang public resources routes storage vendor artisan composer.json composer.lock package.json

      - name: Transfer Archive to cPanel via SCP
        run: |
          SSH_PORT_VALUE="${SSH_PORT:-2223}"
          SSH_OPTS=(-i ~/.ssh/id_rsa -p "$SSH_PORT_VALUE" -o StrictHostKeyChecking=no -o ConnectTimeout=90 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)
          SCP_OPTS=(-i ~/.ssh/id_rsa -P "$SSH_PORT_VALUE" -o StrictHostKeyChecking=no -o ConnectTimeout=90 -o ServerAliveInterval=15 -o ServerAliveCountMax=4)

          retry() {
            local attempts="$1"
            local delay="$2"
            shift 2
            local n=1
            until "$@"; do
              if [ "$n" -ge "$attempts" ]; then
                return 1
              fi
              echo "Attempt $n failed. Retrying in ${delay}s..."
              sleep "$delay"
              n=$((n + 1))
            done
          }

          split -b 20m deploy.tar.gz deploy.tar.gz.part-
          retry 3 20 ssh "${SSH_OPTS[@]}" ${SSH_USERNAME}@${TARGET_HOST} 'rm -f ~/deploy.tar.gz ~/deploy.tar.gz.part-* ~/deploy.zip ~/deploy.zip.part-*'

          for part in deploy.tar.gz.part-*; do
            retry 3 20 scp "${SCP_OPTS[@]}" "$part" ${SSH_USERNAME}@${TARGET_HOST}:~/
          done

          retry 3 20 ssh "${SSH_OPTS[@]}" ${SSH_USERNAME}@${TARGET_HOST} 'cat ~/deploy.tar.gz.part-* > ~/deploy.tar.gz && rm -f ~/deploy.tar.gz.part-*'

      - name: Extract & Execute Artisan Commands on cPanel
        run: |
          REMOTE_DEST="${REMOTE_TARGET:-/home/${SSH_USERNAME}/kalimarau}"
          REMOTE_PUBLIC_HTML="/home/${SSH_USERNAME}/public_html"

          ssh -i ~/.ssh/id_rsa -p ${SSH_PORT:-2223} -o StrictHostKeyChecking=no -o ConnectTimeout=90 -o ServerAliveInterval=15 -o ServerAliveCountMax=4 ${SSH_USERNAME}@${TARGET_HOST} "bash -s" -- "$REMOTE_DEST" "$REMOTE_PUBLIC_HTML" << 'REMOTE_SCRIPT'
            set -euo pipefail
            DEST="$1"
            PUBLIC_HTML="$2"

            mkdir -p "$DEST"
            tar -xzf ~/deploy.tar.gz -C "$DEST"
            rm -f ~/deploy.tar.gz
            test -f "$DEST/artisan"
            mkdir -p "$DEST/storage/app/public" "$DEST/storage/framework/cache" "$DEST/storage/framework/sessions" "$DEST/storage/framework/views" "$DEST/storage/logs" "$DEST/bootstrap/cache"

            # Fix directory & file permissions for cPanel suPHP compliance
            chmod -R 755 "$DEST/storage" "$DEST/bootstrap/cache"
            find "$DEST/storage" "$DEST/bootstrap/cache" -type f -exec chmod 644 {} +

            # Sync compiled assets & adjust index.php paths for cPanel public_html
            if [ -d "$PUBLIC_HTML" ] && [ ! -L "$PUBLIC_HTML" ]; then
              echo "Syncing public assets and configuring public_html/index.php..."
              SOURCE_PUBLIC=$(realpath "$DEST/public")
              TARGET_PUBLIC=$(realpath "$PUBLIC_HTML")
              if [ "$SOURCE_PUBLIC" != "$TARGET_PUBLIC" ]; then
                find "$SOURCE_PUBLIC" -mindepth 1 -maxdepth 1 ! -name storage -exec sh -c '
                  target_dir="$1"
                  shift
                  for source_path do
                    target_path="$target_dir/$(basename "$source_path")"
                    rm -rf "$target_path"
                    cp -a "$source_path" "$target_dir/"
                  done
                ' sh "$TARGET_PUBLIC" {} +
              fi
              chmod -R 755 "$PUBLIC_HTML"
              find "$PUBLIC_HTML" -type f -exec chmod 644 {} +

              # Adjust paths in public_html/index.php to point to project folder (/kalimarau)
              PROJECT_NAME=$(basename "$DEST")
              if [ -f "$PUBLIC_HTML/index.php" ]; then
                sed -i "s|__DIR__.'/\.\./vendor/autoload.php'|__DIR__.'/\.\./${PROJECT_NAME}/vendor/autoload.php'|g" "$PUBLIC_HTML/index.php"
                sed -i "s|__DIR__.'/\.\./bootstrap/app.php'|__DIR__.'/\.\./${PROJECT_NAME}/bootstrap/app.php'|g" "$PUBLIC_HTML/index.php"
                sed -i "s|__DIR__.'/\.\./storage/|__DIR__.'/\.\./${PROJECT_NAME}/storage/|g" "$PUBLIC_HTML/index.php"
              fi

              # Symlink storage in public_html to storage/app/public for uploaded media/images
              rm -rf "$PUBLIC_HTML/storage"
              ln -sfn "$DEST/storage/app/public" "$PUBLIC_HTML/storage"
            fi

            cd "$DEST"
            php artisan optimize:clear
            php artisan migrate --force
            php artisan db:seed --force
            php artisan storage:link 2>/dev/null || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            rm -rf ~/lscache/* 2>/dev/null || true
            echo "SUCCESSFUL_DEPLOYMENT"
          REMOTE_SCRIPT
