name: Deploy to cPanel via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to cPanel via SSH
    runs-on: ubuntu-latest
    env:
      SSH_HOST: ${{ secrets.SSH_HOST }}
      SSH_PORT: ${{ secrets.SSH_PORT }}
      SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
      SSH_PASSPHRASE: ${{ secrets.SSH_PASSPHRASE }}
      REMOTE_TARGET: ${{ secrets.REMOTE_TARGET }}

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, zip, gd, bcmath
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install Composer Dependencies (Production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM Dependencies
        run: npm ci --legacy-peer-deps

      - name: Build Frontend Assets (Vite)
        run: npm run build

      - name: Configure SSH Key & Hostname
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
        run: |
          TARGET_HOST=$(echo "${SSH_HOST:-colorado.iixcp.rumahweb.net}" | sed -e 's|^https://||' -e 's|^http://||' -e 's|/.*$||')
          echo "TARGET_HOST=${TARGET_HOST}" >> $GITHUB_ENV

          mkdir -p ~/.ssh
          printf "%s\n" "${SSH_KEY}" > ~/.ssh/id_rsa
          chmod 600 ~/.ssh/id_rsa

          if [ -n "${SSH_PASSPHRASE}" ]; then
            ssh-keygen -p -P "${SSH_PASSPHRASE}" -N "" -f ~/.ssh/id_rsa || true
          fi

          ssh-keyscan -p ${SSH_PORT:-2223} -H "${TARGET_HOST}" >> ~/.ssh/known_hosts || true

      - name: Package Application Archive (tar.gz)
        run: |
          tar -czf deploy.tar.gz \
            --exclude="public/storage" \
            --exclude="storage/app/*" \
            --exclude="storage/logs/*" \
            --exclude="storage/framework/*" \
            --exclude="node_modules" \
            --exclude=".git" \
            app bootstrap config database lang public resources routes storage vendor artisan composer.json composer.lock package.json

      - name: Transfer Archive to cPanel via SCP
        run: |
          ssh -i ~/.ssh/id_rsa -p ${SSH_PORT:-2223} -o StrictHostKeyChecking=no -o ConnectTimeout=30 ${SSH_USERNAME}@${TARGET_HOST} 'rm -f ~/deploy.tar.gz ~/deploy.zip ~/deploy.zip.part-*'
          scp -i ~/.ssh/id_rsa -P ${SSH_PORT:-2223} -o StrictHostKeyChecking=no -o ConnectTimeout=30 deploy.tar.gz ${SSH_USERNAME}@${TARGET_HOST}:~/deploy.tar.gz

      - name: Extract & Execute Artisan Commands on cPanel
        run: |
          ssh -i ~/.ssh/id_rsa -p ${SSH_PORT:-2223} -o StrictHostKeyChecking=no -o ServerAliveInterval=15 -o ServerAliveCountMax=4 ${SSH_USERNAME}@${TARGET_HOST} << 'EOF'
            set -e
            DEST="${REMOTE_TARGET:-/home/band2936/kalimarau}"
            PUBLIC_HTML="/home/${SSH_USERNAME:-band2936}/public_html"

            mkdir -p "$DEST"
            tar -xzf ~/deploy.tar.gz -C "$DEST"
            rm -f ~/deploy.tar.gz

            # Fix directory & file permissions for cPanel suPHP compliance
            chmod -R 755 "$DEST/storage" "$DEST/bootstrap/cache" 2>/dev/null || true
            find "$DEST/storage" "$DEST/bootstrap/cache" -type f -exec chmod 644 {} + 2>/dev/null || true

            # Sync compiled assets & adjust index.php paths for cPanel public_html
            if [ -d "$PUBLIC_HTML" ] && [ ! -L "$PUBLIC_HTML" ]; then
              echo "Syncing public assets and configuring public_html/index.php..."
              cp -rf "$DEST/public/"* "$PUBLIC_HTML/" 2>/dev/null || true
              chmod -R 755 "$PUBLIC_HTML" 2>/dev/null || true
              find "$PUBLIC_HTML" -type f -exec chmod 644 {} + 2>/dev/null || true

              # Adjust paths in public_html/index.php to point to project folder (/kalimarau)
              PROJECT_NAME=$(basename "$DEST")
              if [ -f "$PUBLIC_HTML/index.php" ]; then
                sed -i "s|__DIR__.'/\.\./vendor/autoload.php'|__DIR__.'/\.\./${PROJECT_NAME}/vendor/autoload.php'|g" "$PUBLIC_HTML/index.php" || true
                sed -i "s|__DIR__.'/\.\./bootstrap/app.php'|__DIR__.'/\.\./${PROJECT_NAME}/bootstrap/app.php'|g" "$PUBLIC_HTML/index.php" || true
                sed -i "s|__DIR__.'/\.\./storage/|__DIR__.'/\.\./${PROJECT_NAME}/storage/|g" "$PUBLIC_HTML/index.php" || true
              fi

              # Symlink storage in public_html to storage/app/public for uploaded media/images
              ln -sfn "$DEST/storage/app/public" "$PUBLIC_HTML/storage" 2>/dev/null || true
            fi

            cd "$DEST"
            php artisan optimize:clear 2>/dev/null || true
            php artisan migrate --force 2>/dev/null || true
            php artisan db:seed --force 2>/dev/null || true
            php artisan storage:link 2>/dev/null || true
            php artisan config:cache 2>/dev/null || true
            php artisan route:cache 2>/dev/null || true
            php artisan view:cache 2>/dev/null || true
            echo "SUCCESSFUL_DEPLOYMENT"
          EOF
