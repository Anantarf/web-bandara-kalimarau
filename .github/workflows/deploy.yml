name: Deploy to cPanel via SSH

on:
  push:
    branches:
      - main

jobs:
  deploy:
    name: Build & Deploy to cPanel
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup PHP Environment
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, pdo, pdo_mysql, zip, gd, bcmath
          coverage: none

      - name: Setup Node.js Environment
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Composer Dependencies (Production)
        run: composer install --no-dev --optimize-autoloader --no-interaction --prefer-dist

      - name: Install NPM Dependencies
        run: npm ci

      - name: Build Frontend Assets (Vite)
        run: npm run build

      - name: Configure SSH Key
        env:
          SSH_KEY: ${{ secrets.SSH_KEY }}
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
        run: |
          mkdir -p ~/.ssh
          cat << 'EOF' > ~/.ssh/id_rsa
          ${SSH_KEY}
          EOF
          chmod 600 ~/.ssh/id_rsa
          ssh-keyscan -p ${SSH_PORT:-22} -H "${SSH_HOST}" >> ~/.ssh/known_hosts || true

      - name: Deploy Files to cPanel via rsync
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          REMOTE_TARGET: ${{ secrets.REMOTE_TARGET }}
        run: |
          rsync -avz --delete -e "ssh -i ~/.ssh/id_rsa -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no" \
            --exclude='.git' \
            --exclude='.github' \
            --exclude='.codex' \
            --exclude='.vscode' \
            --exclude='.editorconfig' \
            --exclude='.env' \
            --exclude='.env.*' \
            --exclude='node_modules' \
            --exclude='storage/framework/cache/data/*' \
            --exclude='storage/framework/sessions/*' \
            --exclude='storage/framework/views/*' \
            --exclude='storage/logs/*' \
            --exclude='tests' \
            --exclude='phpunit.xml' \
            ./ ${SSH_USERNAME}@${SSH_HOST}:${REMOTE_TARGET}

      - name: Execute Artisan Post-Deployment Commands
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USERNAME: ${{ secrets.SSH_USERNAME }}
          REMOTE_TARGET: ${{ secrets.REMOTE_TARGET }}
        run: |
          ssh -i ~/.ssh/id_rsa -p ${SSH_PORT:-22} -o StrictHostKeyChecking=no ${SSH_USERNAME}@${SSH_HOST} << 'EOF'
            cd ${REMOTE_TARGET}
            php artisan migrate --force
            php artisan storage:link 2>/dev/null || true
            php artisan config:cache
            php artisan route:cache
            php artisan view:cache
            php artisan optimize
          EOF
